<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Translator</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
padding:20px;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background-image:url("/static/IMG_0513.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
padding:20px;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
url("/static/IMG_0513.jpg");
background-size:cover;
background-position:center;
}

.container{
width:100%;
max-width:520px;
backdrop-filter:blur(20px);
background:rgba(255,255,255,0.2);
border-radius:20px;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
color:white;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.header h2{
font-size:22px;
}

.toggle{
cursor:pointer;
font-size:18px;
}

select{
width:100%;
padding:10px;
border-radius:10px;
border:none;
margin-bottom:10px;
}

textarea{
width:100%;
height:120px;
border-radius:12px;
border:none;
padding:12px;
font-size:15px;
resize:none;
outline:none;
margin-bottom:10px;
}

.buttons{
display:flex;
gap:10px;
}

button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#ffffff;
color:#333;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.result{
margin-top:20px;
padding:15px;
border-radius:12px;
background:rgba(255,255,255,0.3);
}

.result-header{
display:flex;
justify-content:space-between;
margin-bottom:8px;
}

.copy{
cursor:pointer;
}

.loader{
display:none;
text-align:center;
margin-top:10px;
}

.spinner{
border:4px solid rgba(255,255,255,0.4);
border-top:4px solid white;
border-radius:50%;
width:25px;
height:25px;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

@media(max-width:600px){
.container{
padding:20px;
}
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h2>🌍 AI Translator</h2>
<i class="fa-solid fa-moon toggle" onclick="toggleDarkMode()"></i>
</div>

<select>
<option>Auto Detect → Hindi</option>
<option>English → Hindi</option>
<option>English → Spanish</option>
<option>English → French</option>
</select>

<textarea id="inputText" placeholder="Enter text or use voice..."></textarea>

<div class="buttons">

<button onclick="startVoice()">
<i class="fa-solid fa-microphone"></i>
</button>

<button onclick="translateText()">
<i class="fa-solid fa-language"></i> Translate
</button>

</div>

<div class="loader" id="loader">
<div class="spinner"></div>
</div>

<div class="result">

<div class="result-header">
<h3>Translation</h3>
<i class="fa-solid fa-copy copy" onclick="copyText()"></i>
</div>

<p id="output"></p>

</div>

</div>

<script>

function toggleDarkMode(){
document.body.classList.toggle("dark");
}

/* AJAX TRANSLATION */

function translateText(){

let text=document.getElementById("inputText").value;

document.getElementById("loader").style.display="block";

fetch("/translate",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({text:text})
})

.then(res=>res.json())
.then(data=>{
document.getElementById("loader").style.display="none";
document.getElementById("output").innerText=data.translation;
});

}

/* COPY */

function copyText(){
let text=document.getElementById("output").innerText;
navigator.clipboard.writeText(text);
alert("Copied!");
}

/* VOICE INPUT */

function startVoice(){

let recognition=new(window.SpeechRecognition || window.webkitSpeechRecognition)();

recognition.lang="en-US";

recognition.start();

recognition.onresult=function(event){
document.getElementById("inputText").value=event.results[0][0].transcript;
}

}

</script>

</body>
</html>
